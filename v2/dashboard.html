<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA 광고 실적 대시보드</title>
<style>
/* 색 토큰 (아래 '기존 DA 대시보드 스타일'이 덮어씀) */
:root{
  color-scheme:light;
  --page:#ffffff; --surface:#ffffff; --surface-2:#f3f5f7; --ink:#16202b; --ink-2:#44505c; --muted:#808b96;
  --grid:#edf0f3; --axis:#cfd6dd; --border:#e4e8ec; --row-alt:rgba(22,32,43,.02);
  --prev:#b8c0c8; --pos:#0b875b; --pos-bg:rgba(11,135,91,.10); --neg:#d9480f; --neg-bg:rgba(217,72,15,.10); --ev:#a05a00;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:rgba(37,99,235,.08); --head:#f5f8ff;
  --c1:var(--accent); --c4:#eda100; --wash:var(--accent-soft); --sel:color-mix(in srgb,var(--accent) 18%,transparent);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#11161c; --surface:#181f27; --surface-2:#212a34; --ink:#eef2f6; --ink-2:#b8c2cc; --muted:#7d8894;
    --grid:#26303b; --axis:#36424f; --border:#2a3540; --row-alt:rgba(255,255,255,.025);
    --prev:#5d6874; --pos:#34c38f; --pos-bg:rgba(52,195,143,.14); --neg:#f0844f; --neg-bg:rgba(240,132,79,.14); --ev:#e0a040; --head:#151c24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#11161c; --surface:#181f27; --surface-2:#212a34; --ink:#eef2f6; --ink-2:#b8c2cc; --muted:#7d8894;
  --grid:#26303b; --axis:#36424f; --border:#2a3540; --row-alt:rgba(255,255,255,.025);
  --prev:#5d6874; --pos:#34c38f; --pos-bg:rgba(52,195,143,.14); --neg:#f0844f; --neg-bg:rgba(240,132,79,.14); --ev:#e0a040; --head:#151c24;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font:14px/1.5 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}header.top{position:static}.menu{margin-left:0;overflow-x:auto}}

header.top{position:sticky;top:0;z-index:30;isolation:isolate;background:var(--head);border-bottom:1px solid var(--border)}
main.wrap{position:relative;z-index:0;padding-bottom:80px}
.bar1{display:flex;align-items:center;gap:8px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:12px;min-width:0}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.asof{font-size:12px;color:var(--muted)}
.menu{display:flex;gap:6px;margin-left:auto}
.menu button{background:none;border:0;margin:8px 0;padding:6px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.menu button:hover{background:var(--surface-2)}
.menu button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.bk-tools{display:flex;gap:6px;flex-wrap:wrap}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:6px}
.bar2:last-child{padding-bottom:10px}
.filt-tg{display:inline-flex;align-items:center;gap:6px;max-width:min(560px,100%);min-width:0;padding:4px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.filt-tg[aria-expanded="true"]{background:var(--wash)}
.filt-ic{display:inline-block;font-size:10px;color:var(--muted);transition:transform .15s}
.filt-tg[aria-expanded="true"] .filt-ic{transform:rotate(90deg)}
.filt-tg b{min-width:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:17px;text-align:center}
.filt-sum{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;color:var(--muted);font-size:12px}
#filtRows{border-top:1px dashed var(--grid);margin-top:2px;max-height:52vh;overflow:auto}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--surface);padding:4px 12px;border-radius:999px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{border-color:var(--axis)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.field{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.flabel{font-size:12px;color:var(--muted);min-width:64px}
select,input[type=search],input[type=text]{font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 6px}
select{cursor:pointer;max-width:260px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:96px;overflow:auto;min-width:0;flex:1 1 400px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:3px 11px 3px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);opacity:.25}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--ink-2);background:var(--surface)}
.chip[aria-pressed="true"] i{background:var(--accent);opacity:1}
.lnk{border:0;background:none;padding:2px 4px;font-size:12px;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--axis)}
.hint{font-size:11px;color:var(--muted)}
.seg button:focus-visible,.menu button:focus-visible,select:focus-visible,.btn:focus-visible,.chip:focus-visible,.lnk:focus-visible{outline:2px solid var(--c1);outline-offset:2px}

.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:26px 0 10px}
.sec-h h2{font-size:15px;font-weight:700;margin:0}
.sec-h .desc{font-size:12px;color:var(--muted)}
.sec-h .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.pad{padding:12px 14px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.btn:hover{color:var(--ink)}
.btn.pri{background:var(--c1);color:#fff;border-color:var(--c1)}

/* 요약 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{padding:11px 14px 10px;border:1px solid var(--border);border-radius:14px;background:var(--surface);min-width:0}
.t-l{font-size:12px;color:var(--ink-2)}
.t-v{font-size:21px;font-weight:650;letter-spacing:-.01em;margin:2px 0 3px;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.t-v small{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:3px}
.t-r{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-r b{font-weight:600;color:var(--ink-2)}
.neg{color:var(--neg)!important}
.pos{color:var(--pos)!important}
/* 증감 배지 */
.bd{display:inline-block;padding:0 7px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.6}
.bd.pos{background:var(--pos-bg)}
.bd.neg{background:var(--neg-bg)}
.bd.zero{color:var(--muted);background:var(--surface-2)}
.grid .sub .bd{padding:0 5px;line-height:1.5}

/* 차트 */
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:440px){.charts{grid-template-columns:minmax(0,1fr)}}
main section+section{margin-top:12px}
.cc{padding:12px 14px 6px;min-width:0}
.cc-t{font-size:13px;font-weight:650;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cc-t .hint{font-weight:400}
.cc-v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:1px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cc-v b{font-size:17px;font-weight:650;color:var(--ink)}
.cc-b{position:relative;margin-top:4px}
.cc-b svg{display:block;overflow:visible;touch-action:pan-y;width:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.base0{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.yt,.xt{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.yt{text-anchor:end}
.vl{font-size:9.5px;fill:#2a78d6;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#fcfcfb;stroke-width:3px}
.xax{stroke:#c3c2b7;stroke-width:1;shape-rendering:crispEdges}
.lgs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:#52514e;margin:2px 0 0}
.lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cc-b .lgs svg{display:inline-block;flex:none;width:22px;height:8px;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--surface);stroke-width:2}
.evl{stroke:var(--ev);stroke-width:1;stroke-dasharray:3 3}
.evt{fill:var(--ev);font-size:10px}
.guide{stroke:var(--axis);stroke-width:1}
.tip{position:absolute;top:6px;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:170px;font-variant-numeric:tabular-nums}
.tip b{display:block;font-weight:600;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:12px;justify-content:space-between}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.tip .ev{color:var(--ev);font-size:11px;margin-top:4px}

/* 표 — 머리행 · 첫 열 고정 */
.tbl-wrap{overflow:auto;max-height:72vh;border-radius:14px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
.grid th,.grid td{padding:5px 10px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--grid)}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--axis);vertical-align:bottom}
.grid thead th b{display:block;color:var(--ink-2);font-weight:600}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.grid thead th:first-child{z-index:3;background:var(--head)}
.grid tbody tr:nth-child(even) td{background-image:linear-gradient(var(--row-alt),var(--row-alt))}
.grid tr.tot td{font-weight:650;border-top:1px solid var(--ink-2)}
.grid tr.cur td{background-color:var(--wash)}
.grid .sub{display:block;font-size:11px;color:var(--muted);line-height:1.2;font-weight:400}
.grid td[data-v]{cursor:cell;user-select:none;-webkit-user-select:none}
.grid td.selc{background-color:var(--sel)!important;box-shadow:inset 0 0 0 1px var(--accent)}
details.tbl summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:8px 2px}
.notes{font-size:12px;color:var(--ink-2);margin:0;padding-left:18px;display:grid;gap:3px}
.notes b{color:var(--ink)}
.warn{border-color:var(--c4);background:color-mix(in srgb,var(--c4) 8%,var(--surface))}

/* 드래그 합계 표시줄 (엑셀 상태 표시줄처럼) */
#selbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:40;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;max-width:calc(100vw - 32px);padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--page);font-size:12.5px;font-variant-numeric:tabular-nums;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#selbar b{font-weight:650}
#selbar .k{opacity:.7;margin-right:4px}
#selbar button{border:0;background:none;color:inherit;opacity:.7;cursor:pointer;padding:0 2px;font-size:12px;text-decoration:underline}

/* 빈 화면 · 끌어다 놓기 */
.drop-empty{margin:60px auto;max-width:680px;text-align:center;padding:40px 24px;border:2px dashed var(--axis);border-radius:14px;background:var(--surface)}
.drop-empty h2{margin:0 0 8px;font-size:18px}
.drop-empty p{color:var(--ink-2);font-size:13px;margin:6px 0}
body.dragging .drop-empty,body.dragging main{outline:3px dashed var(--c1);outline-offset:-6px}
.loading{padding:40px;text-align:center;color:var(--muted)}
/* 묶음 제목 */
.grp{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.grp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.grp::after{content:"";flex:1;height:1px;background:var(--grid)}
/* 기존 DA 대시보드(dashboard.py) 스타일 — 연회색 상단 · 흰 카드 · 격자 표, 선택 = 파랑 */
:root,:root[data-theme]{--page:#ffffff;--surface:#ffffff;--surface-2:#F0F2F6;--ink:#0F172A;--ink-2:#334155;--muted:#64748B;--grid:#E2E8F0;--axis:#CBD5E1;--border:#E2E8F0;
  --accent:#2563EB;--accent-soft:rgba(37,99,235,.06);--pos:#16A34A;--neg:#DC2626;--head:#F0F2F6;--prev:#6b6a66;--wash:#EFF6FF;--sel:rgba(37,99,235,.15);--c1:#2a78d6}
body{font-family:"Source Sans Pro","Source Sans 3","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
/* 상단바 — 광고 신규 실적 대시보드(ad-first-dashboard)와 같은 모양: 반투명 바 · 밑줄 메뉴 · 회색 트랙 위 흰 선택 */
header.top{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E2E8F0}
header.top .brand h1{color:#0b0b0b;font-size:17px}
header.top .menu{gap:22px}
header.top .menu button{background:none;border:0;border-radius:0;margin:0;padding:15px 0 13px;font-size:14px;font-weight:600;color:#898781;border-bottom:2px solid transparent}
header.top .menu button:hover{background:none;color:#52514e}
header.top .menu button[aria-pressed="true"]{background:none;color:#0b0b0b;border-bottom-color:#0b0b0b}
header.top .seg{display:inline-flex;gap:0;background:#efeeea;border-radius:8px;padding:2px}
header.top .seg button{border:0;background:transparent;padding:5px 13px;border-radius:6px;font-size:13px;color:#52514e}
header.top .seg button:hover{color:#0b0b0b}
header.top .seg button[aria-pressed="true"]{background:#fff;color:#0b0b0b;font-weight:600;box-shadow:0 0 0 1px rgba(11,11,11,.10),0 1px 2px rgba(0,0,0,.06)}
header.top .filt-tg{border-radius:8px;padding:5px 11px}
header.top .btn{border-radius:6px}
header.top input[type=date]{font-size:13px;background:#fff;border:1px solid #E2E8F0;border-radius:6px;padding:3px 6px}
header.top .chip[aria-pressed="true"] i{background:#2563EB}
.sec-h h2{font-size:19px;font-weight:600;color:#1E293B}
.tiles{gap:8px}
.tile{border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:9px 12px}
.t-l{font-size:11.5px;color:#64748B;font-weight:500}
.t-v{font-size:19px;font-weight:700;color:#0F172A}
.t-r b{color:#334155}
.bd{background:none!important;padding:0!important;font-weight:500!important}
.grp{font-size:14px;font-weight:600;color:#334155;margin:16px 0 8px}
.grp::before{display:none}
.card{border-radius:10px;border-color:#E2E8F0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cc-t{font-size:13px}
.tbl-wrap{border-radius:8px}
.grid th,.grid td{border-right:1px solid #E2E8F0}
.grid thead th{background:#F8FAFC!important;color:#64748B;font-weight:400}
.grid thead th b{color:#475569;font-weight:600}
.grid tbody tr:nth-child(even) td{background-image:none}
.grid tr.tot td{background:#EEF2FF!important;font-weight:700;border-top:1px solid #E2E8F0}
.grid tr.cur td{background-color:#F8FAFC}
.grid td:first-child{background:#fff}
/* 타일 아래 비교(전월비 · 전전년비 등)는 한 줄 */
.t-r2{justify-content:flex-start;gap:10px;white-space:nowrap;font-size:11.5px}
.t-r2>span{flex:none}
/* 추이 그래프 — 기존 dashboard.py Plotly 양식(밝은 면 배경 · 가로 격자선만 · 옅은 축 글자) */
.card.cc{background:#fcfcfb;border:1px solid #eeede8;box-shadow:none;border-radius:8px}
.cc .gl{stroke:#e1e0d9}
.cc .yt,.cc .xt{fill:#898781}
.cc-t{color:#0b0b0b;font-size:13px;font-weight:600}
.tile .t-r{white-space:nowrap;gap:8px;font-size:11.5px}
.tile .t-r>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.grp-tg{padding:6px 0 0}
/* 리뷰 메모 */
details.memo{margin:14px 0 4px;border:1px solid #E2E8F0;border-radius:10px;background:#fffdf5}
details.memo summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:#334155}
details.memo summary .hint{font-weight:400;margin-left:6px}
.memo-b{padding:0 12px 10px}
.memo-v{font-size:13px;line-height:1.65;color:#1E293B;white-space:normal}
.memo-t{display:flex;gap:8px;align-items:center;margin-top:8px}
#memoTa{width:100%;font:inherit;font-size:13px;line-height:1.6;border:1px solid #CBD5E1;border-radius:8px;padding:8px 10px;background:#fff;color:#0F172A}
/* 펼쳐보기 */
.tw{display:inline-block;border:0;background:none;width:18px;padding:0;color:#52514e;cursor:pointer;font-size:12px}
.nm{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:#0F172A;max-width:360px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font:inherit}
.nm:hover{text-decoration:underline}
.lv{display:inline-block;font-size:10px;color:#64748B;border:1px solid #E2E8F0;border-radius:4px;padding:0 4px;margin-right:6px}
.grid tr.sel td{background-color:#EFF6FF!important}
.grid tr.etc td{color:#64748B}
#srcRow{flex:1 1 100%;max-height:72px}
/* 실적 요약표 2단 머리글 */
.grid.g2 thead tr.h1 th{height:30px;top:0;text-align:center;font-size:12.5px;font-weight:700;color:#0F172A;border-left:1px solid #CBD5E1}
.grid.g2 thead tr.h1 th:first-child{text-align:left;vertical-align:bottom;z-index:4;border-left:0}
.grid.g2 thead tr.h2 th{top:30px}
.grid.g2 thead th.gh-cur{background:#F8FAFC!important}
.grid.g2 thead th.gh-yoy{background:#EEF6FF!important;color:#1E4E8C}
.grid.g2 thead th.gh-yoy2{background:#F3F0FF!important;color:#4B3A9E}
.grid.g2 thead th.gh-tgt,.grid.g2 thead th.gh-tgtr{background:#FFF7E8!important;color:#8A5A00}
.grid .bl{border-left:1px solid #CBD5E1!important}
/* 상단바 — 광고 신규 실적 대시보드 모양, 포인트 색 = 민트 */
:root,:root[data-theme]{--mint:#12b886;--mint-d:#087f5b;--mint-l:#e6fcf5;--mint-t:#d3f5ea;--accent:#12b886;--sel:rgba(18,184,134,.18);--wash:#effbf6}
header.top{background:rgba(255,255,255,.95);border-bottom:2px solid var(--mint)}
header.top .menu button[aria-pressed="true"]{color:var(--mint-d);border-bottom-color:var(--mint)}
header.top .menu button:hover{color:var(--mint-d)}
header.top .seg{background:var(--mint-t)}
header.top .seg button{color:#0b5c46}

<body>
<header class="top">
  <div class="wrap">
    <div class="bar1">
      <div class="brand"><h1>DA 광고 실적</h1><span class="asof" id="asof"></span></div>
      <nav class="menu" aria-label="화면">
        <button data-page="summary">요약</button>
        <button data-page="drill">펼쳐보기</button>
      </nav>
      <div class="bk-tools">
        <button class="btn" id="btnSave" type="button" title="이 브라우저에 저장된 데이터를 파일로 받아 두기 (다른 PC · 브라우저로 옮길 때)" hidden>백업 내려받기</button>
        <button class="btn" id="btnOpen" type="button" title="PC에서 만든 백업(.json.gz)을 저장된 데이터에 합치기 (같은 날짜는 교체)">백업 파일 열기</button>
        <input type="file" id="fileOpen" accept=".gz,.json,application/json,application/gzip" hidden>
        <button class="btn" id="btnClear" type="button" title="이 브라우저에 저장된 데이터 지우기" hidden>데이터 지우기</button>
      </div>
    </div>
    <div class="bar2" id="barRow">
      <div class="seg" role="group" aria-label="기간 단위">
        <button data-set="grain" data-v="month">월별</button>
        <button data-set="grain" data-v="week">주별</button>
        <button data-set="grain" data-v="day">일별</button>
      </div>
      <label class="field">기준 <select id="selAt" aria-label="기준 기간"></select></label>
      <span class="field" id="fCustom" hidden>실적 <input type="date" id="cuR0"> ~ <input type="date" id="cuR1"> · 비교 <input type="date" id="cuC0"> ~ <input type="date" id="cuC1"> <button class="lnk" id="cuYoy" type="button" title="실적 기간의 364일 전 같은 요일로">비교 = 전년 동요일</button></span>
      <label class="field" id="fRange" title="표 · 그래프에 보여 줄 기간 수 — 기준 기간에서 끝나는 최근 N개">범위 <select id="selRange" aria-label="표시 범위"></select></label>
      <div class="seg" role="group" aria-label="집계 방식">
        <button data-set="mode" data-v="sum">누계</button>
        <button data-set="mode" data-v="avg">일평균</button>
      </div>
      <span class="field" id="fCmp">비교</span>
      <div class="seg" role="group" aria-label="비교 기준" id="segCmp">
        <button data-set="cmp" data-v="yoy">전년 동기간</button>
        <button data-set="cmp" data-v="pop" id="btnPop">전월</button>
        <button data-set="cmp" data-v="yoy2" id="btnYoy2">전전년</button>
      </div>
    </div>
    <div class="bar2">
      <span class="field">비용출처</span>
      <div class="seg" role="group" aria-label="비용출처 묶음" id="bucketSeg"></div>
      <span id="srcRow" class="chips" hidden></span>
      <button class="filt-tg" id="btnFilt" type="button" aria-expanded="false" aria-controls="filtRows"><span class="filt-ic" aria-hidden="true">▸</span>필터<b id="filtN" hidden></b><span class="filt-sum" id="filtSum"></span></button>
    </div>
    <div id="filtRows" hidden></div>
  </div>
</header>

<main class="wrap" id="main"><div class="loading">불러오는 중…</div></main>
<div id="selbar" hidden></div>
<script src="calc.js"></script>
<script>
'use strict';
const C = window.DaCalc;
const $id = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BUCKETS = [['TOTAL', 'TOTAL'], ['TOTAL(서비스비용미반영)', 'TOTAL(서비스비용 제외)'], ['거래액확대', '거래액확대'], ['신규고객확대', '신규고객확대'], ['인지도제고', '인지도제고'], ['상세', '비용출처(상세)']];
// 필터 — 값 고르기(칩) · 이름 검색
const FILT_DIMS = [['ch', '채널'], ['md', '매체'], ['pr', '상품'], ['bpu', '부서(BPU)'], ['cat', '카테고리'], ['dev', '디바이스'], ['tg', '대상여부'], ['at', '광고유형']];
const NAME_DIMS = [['camp', '캠페인'], ['sub', '하위캠페인'], ['bp', '브랜드/기획전'], ['pno', '기획전번호']];
const RANGES = { month: [[13, '최근 13개월'], [25, '최근 25개월'], ['all', '전체']], week: [[8, '최근 8주'], [13, '최근 13주'], [26, '최근 26주'], [53, '최근 53주'], ['all', '전체']], day: [[14, '최근 14일'], [31, '최근 31일'], [60, '최근 60일'], [92, '최근 92일'], ['all', '전체']] };
// 요약 화면 타일 · 차트 묶음
const GROUPS = [['주요', ['cost', 'nrev', 'roas']], ['매출 · 효율', ['trev', 'troas', 'npr', 'aovt', 'crt', 'crct']], ['유입 · 클릭', ['uv', 'ctr', 'cpc', 'cpuv']], ['가입 · 첫구매', ['join', 'jcpa', 'fp', 'fcpa', 'nbr', 'ncpa']]];
const CORE = ['cost', 'nrev', 'roas', 'trev', 'troas', 'join', 'jcpa', 'fp', 'fcpa', 'nbr', 'ncpa'];
const STORE_KEY = 'da-dashboard-v2';
const DEF = { page: 'summary', grain: 'month', mode: 'sum', cmp: 'yoy', at: '', range: { month: 13, week: 8, day: 14 }, bucket: 'TOTAL',
  filt: {}, names: {}, filtOpen: false, cols: 'core', showCmp: true, grpOpen: [], cu: null, prevY: false,
  drill: { dims: ['src', 'ch', 'md', 'pr', 'camp'], open: [], sel: '', q: '', hideSmall: true, sort: 'cost', cols: 'core', top: 20 }, sv: 3 };
let S = load();
let P = null, R = null;
const cache = {};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s) {
      if ((s.sv || 0) < 3) { s.range = { ...(s.range || {}), week: 8, day: 14 }; if (s.bucket === '') s.bucket = 'TOTAL'; if (s.page === 'period') s.page = 'summary'; s.sv = 3; }
      return deepMerge(structuredClone(DEF), s);
    }
  } catch (e) { /* 저장소 차단 */ }
  return structuredClone(DEF);
}
function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ } }

// ── 백업 저장(IndexedDB) ────────────────────────────────────────────
const DB = 'da-dashboard-v2-backup';
function idb() { return new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet() { try { const db = await idb(); return await new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get('active'); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); } catch (e) { return null; } }
async function idbPut(v) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'active'); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } }
async function idbDel() { try { const db = await idb(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete('active'); t.oncomplete = res; t.onerror = res; }); } catch (e) { /* 무시 */ } }

async function downloadBackup() {
  if (!P) return;
  const blob = new Blob([JSON.stringify(P)]);
  const gz = await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(gz); a.download = `DA대시보드_백업_${(P.lastDate || '').replace(/-/g, '')}.json.gz`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function readBackup(file) {
  let text;
  const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) text = await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text();
  else text = await file.text();
  const p = JSON.parse(text);
  if (p.format !== 'da-dashboard-backup') throw new Error('DA 대시보드 백업이 아닙니다 (build_data.py · make_backup.bat 로 만든 .json.gz 파일을 여세요)');
  return p;
}
// 새 백업을 이 브라우저에 저장된 데이터에 합친다 — 새 백업에 있는 날짜는 교체, 나머지 날짜는 그대로 (24년 고정 구간은 24년 파일로만 바뀜)
async function mergeAndStore(add) {
  const base = await idbGet();
  const merged = C.mergeBackup(base, add);
  const stored = await idbPut(merged);
  use(merged);
  const m = merged.merged, r = merged.source;
  toast(m ? `저장된 데이터에 합쳤습니다 · 새 날짜 ${m.added}일 · 교체 ${m.replaced}일 · 유지 ${m.kept}일${m.ignored ? ` · 24년 고정 구간이라 건너뜀 ${m.ignored}일` : ''} → ${r.from} ~ ${r.to}` : `저장했습니다 · ${r.from} ~ ${r.to}`);
  if (!stored) toast('브라우저 저장소를 쓸 수 없어 새로고침하면 사라집니다 — 백업 내려받기로 받아 두세요');
}
async function openFile(file) {
  $id('main').innerHTML = '<div class="loading">백업 읽어서 합치는 중…</div>';
  try { await mergeAndStore(await readBackup(file)); } catch (e) { showEmpty(`<p class="neg">${esc(e.message)}</p>`); }
}
function toast(msg) { const d = document.createElement('div'); d.className = 'card pad warn'; d.style.cssText = 'position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:50;font-size:13px;max-width:90vw'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 8000); }

function use(p) {
  if (!p.row) { P = R = null; showEmpty(p.targets ? '<p>목표 파일은 저장했습니다. 이제 원천(로데이터)으로 만든 백업을 넣으세요.</p>' : ''); return; }
  P = p;
  R = C.prepare(p.row);
  for (const k in cache) delete cache[k];
  $id('btnClear').hidden = false; $id('btnSave').hidden = false;
  const s = p.source || {}, yy = d => d.slice(2).replace(/-/g, '.');
  $id('asof').textContent = `데이터 ${yy(s.from)} ~ ${yy(s.to)}` + (s.lock ? ` · 24년 저장됨(~${yy(s.lock)})` : ' · 24년 없음');
  render();
}
function showEmpty(extra = '') {
  $id('main').innerHTML = `<div class="drop-empty"><h2>DA 광고 실적 대시보드</h2>
    <p>PC 에서 만든 <b>백업 파일(.json.gz)을 여기에 끌어다 놓거나 백업 파일 열기</b>로 고르면 이 브라우저에 저장됩니다. 다음부터는 새로 만든 백업만 넣으면 날짜 단위로 이어 붙습니다.</p>
    <p class="hint">백업 만들기(대시보드 폴더): <b>make_backup_24.bat</b> 에 24년 파일 끌어다 놓기(처음 한 번) · <b>make_backup.bat</b> 에 25·26년 파일(매일) · <b>make_targets.bat</b> 에 목표 파일(목표가 바뀔 때) → 열린 backup 폴더의 최신 파일을 여기로. 원천은 PC 에서만 읽어 서버 메모리를 쓰지 않습니다.</p>${extra}
    <p><button class="btn" type="button" onclick="document.getElementById('fileOpen').click()">백업 파일 열기</button></p></div>`;
}

// ── 공통: 조건 · 기간 · 시리즈 ──────────────────────────────────────
function filtKey() { return JSON.stringify([S.bucket, S.filt, S.names]); }
function series() {
  const k = 's:' + filtKey();
  return cache[k] || (cache[k] = C.daily(R, { bucket: bucketArg(), where: S.filt, names: S.names }));
}
function plist() { const k = 'p:' + S.grain; return cache[k] || (cache[k] = C.periods(R, S.grain)); }
function atIndex(ps) { const i = ps.findIndex(p => p.key === S.at); return i >= 0 ? i : ps.length - 1; }
function shown(ps) {
  const ai = atIndex(ps), r = S.range[S.grain];
  const n = r === 'all' ? ai + 1 : Math.min(+r, ai + 1);
  return ps.slice(ai + 1 - n, ai + 1);
}
function hasYoy2() { return R && R.dates.length && (C.dnum(R.dates[R.dates.length - 1]) - C.dnum(R.dates[0]) >= 728 - 31); }
const val = (m, sums) => C.value(m, sums, S.mode);
function deltaHTML(m, cur, prev, label) {
  const p = C.pct(cur, prev);
  if (p == null) return `${label ? label + ' ' : ''}<span>–</span>`;
  const good = m.lowerBetter ? p < 0 : p > 0, cls = Math.abs(p) < 0.05 ? 'zero' : (good ? 'pos' : 'neg');
  return `${label ? label + ' ' : ''}<span class="bd ${cls}">${C.signed(p)}</span>`;
}

// ── 연도 겹쳐보기 선 그래프 — 기존 dashboard.py(Plotly) 추이 그래프와 같은 양식 ──────────
// 당해년도 = 파랑 굵은 실선(점마다 값 라벨 · 끝점 강조), 전년 = 진회색 실선, 전전년 = 회색 긴 점선, 통합 툴팁
const YEAR_STYLE = [{ color: '#2a78d6', width: 2.6 }, { color: '#6b6a66', width: 2 }, { color: '#a3a19b', width: 2, dash: '7 4' }];
function niceStep(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), r = v / p; return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * p; }
// o = {metric, labels(x 눈금), head(x별 툴팁 제목), lines:[{k, name, values, tips}], showText}
function yearChart(el, o) {
  const m = o.metric, W = Math.max(260, el.clientWidth || 600), H = o.h || 250, L = 50, Rr = 16, T = 18, B = 22;
  const n = o.labels.length, vis = [...o.lines].sort((a, b) => b.k - a.k);      // 이전 연도부터 그려 당해년도가 위
  const vals = vis.flatMap(l => l.values.map(v => C.scaled(m, v)).filter(v => v != null));
  if (!vals.length) { el.innerHTML = '<div class="hint" style="padding:40px 0;text-align:center">표시할 데이터가 없습니다</div>'; return; }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad * (o.showText ? 2.2 : 1);                                   // 값 라벨 자리
  if (Math.min(...vals) >= 0 && lo < 0) lo = 0;
  const step = niceStep((hi - lo) / 4), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const x = i => n <= 1 ? (L + W - Rr) / 2 : L + (W - L - Rr) * i / (n - 1);
  const y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const dp = Math.min(2, (String(+step.toFixed(4)).split('.')[1] || '').length);
  let g = '';
  for (let v = y0; v <= y1 + step / 2; v += step) g += `<line class="gl" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="yt" x="${L - 6}" y="${y(v) + 3.5}">${C.fmtNum(v, dp)}</text>`;
  g += `<line class="xax" x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}"/>`;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L - Rr) / 46))));
  o.labels.forEach((lb, i) => { if (i % every === 0 || n <= 12) g += `<text class="xt" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb)}</text>`; });
  for (const l of vis) {
    const st = YEAR_STYLE[Math.min(l.k, 2)];
    let d = '', pen = false;
    l.values.forEach((v, i) => { const sv = C.scaled(m, v); if (sv == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(sv).toFixed(1); pen = true; });
    g += `<path class="ln" d="${d}" stroke="${st.color}" stroke-width="${st.width}"${st.dash ? ` stroke-dasharray="${st.dash}"` : ''}/>`;
    if (l.k === 0) {
      if (o.showText) l.values.forEach((v, i) => { const sv = C.scaled(m, v); if (sv != null) g += `<text class="vl" x="${x(i)}" y="${y(sv) - 7}" text-anchor="middle">${C.fmt(m, v, S.mode)}</text>`; });
      let li = l.values.length - 1; while (li >= 0 && C.scaled(m, l.values[li]) == null) li--;
      if (li >= 0) g += `<circle cx="${x(li)}" cy="${y(C.scaled(m, l.values[li]))}" r="4.5" fill="${st.color}" stroke="#fcfcfb" stroke-width="2"/>`;
    }
  }
  g += `<line class="guide" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><g class="hov"></g><rect x="${L}" y="0" width="${W - L - Rr}" height="${H}" fill="transparent" class="hit"/>`;
  const legend = [...o.lines].sort((a, b) => a.k - b.k).map(l => { const st = YEAR_STYLE[Math.min(l.k, 2)]; return `<span class="lg"><svg width="22" height="8"><line x1="0" x2="22" y1="4" y2="4" stroke="${st.color}" stroke-width="${st.width}"${st.dash ? ` stroke-dasharray="${st.dash}"` : ''}/></svg>${esc(l.name)}</span>`; }).join('') + (o.note ? `<span class="hint">${esc(o.note)}</span>` : '');
  el.innerHTML = `<div class="lgs">${legend}</div><svg class="plot" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.label || '')}">${g}</svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg.plot'), guide = svg.querySelector('.guide'), hov = svg.querySelector('.hov'), tip = el.querySelector('.tip'), hit = svg.querySelector('.hit');
  const move = ev => {
    const bb = svg.getBoundingClientRect(), px = (ev.clientX - bb.left) / bb.width * W;
    const i = n <= 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((px - L) / (W - L - Rr) * (n - 1))));
    guide.setAttribute('x1', x(i)); guide.setAttribute('x2', x(i)); guide.setAttribute('visibility', 'visible');
    hov.innerHTML = vis.map(l => { const v = C.scaled(m, l.values[i]); return v == null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${YEAR_STYLE[Math.min(l.k, 2)].color}" stroke="#fcfcfb" stroke-width="2"/>`; }).join('');
    const cur = (o.lines.find(l => l.k === 0) || { values: [] }).values[i];
    const rows = [...o.lines].sort((a, b) => a.k - b.k).map(l => {
      const v = l.values[i], dlt = l.k > 0 ? C.pct(cur, v) : null;

// 연도 겹쳐보기 데이터 — 기준 기간의 연도(Y) · 전년(Y-1) · 전전년(Y-2)
//  월별: x = 1~12월, 각 연도의 그 달 실적. 진행 중인 달은 전년 · 전전년도 같은 요일 기간(MTD, 364 · 728일 전)
//  주별 · 일별: x = 표시 범위의 기간, 전년 · 전전년 = 364 · 728일 전 같은 요일 기간

        const p = byKey.get(`${yr}-${String(mo).padStart(2, '0')}`);
        if (!p || (k === 0 && p.start > at.start)) { sums.push(null); tips.push(''); continue; }
        if (k > 0 && at.partial && mo === at.m) {               // 진행 중인 달: 같은 요일 MTD

        }

      }

  }
  const lines = [0, 1, 2].map(k => {
    const sums = [], tips = [];

      const cur = C.curIdx(p, s);

      sums.push(sum(ix)); tips.push(k === 0 ? '' : rng(ix));

}

const GRAIN_N = { month: '월별', week: '주별', day: '일별' };

      start: C.dnum(cu.r0), end: C.dnum(cu.r1), idx, partial: false, range: `${cu.r0} ~ ${cu.r1}`, custom: true };
    const a = at.start, b = at.end;

function tgtOn() { return P.targets && ['TOTAL', 'TOTAL(서비스비용미반영)'].includes(S.bucket); }

// ════════════════════════════════════════════════════════════════════
// 리뷰 메모 — 1차 초안은 자동으로 쓰고, 고치면 그 글을 저장 (백업에 함께 담김)

const memoDrafts = {}, aiPending = {}, aiFail = {};

function memoKey(sec, at) { return [sec, S.grain, at.key === 'custom' ? `${S.cu.r0}~${S.cu.r1}` : at.key, S.bucket, filterSummary(), S.mode].join('|'); }
function memoHTML(sec, title, at, draft) {

         <div class="memo-t"><button class="btn pri" data-memo-save="${esc(key)}">저장</button><button class="btn" data-memo-cancel="1">취소</button></div>`

         <div class="memo-t"><button class="btn" data-memo-edit="${esc(key)}">편집</button>${g && g.ready ? `<button class="btn" data-memo-ai="${esc(key)}"${aiPending[key] ? ' disabled' : ''}>Gemini 로 다시 쓰기</button>` : ''}${saved ? `<button class="lnk" data-memo-reset="${esc(key)}">기본 초안으로 되돌리기</button>` : ''}</div>`}</div></details>`;
}
async function memoSave(key, text, src = 'user') {

// Gemini 에 초안 요청 — 화면이 계산한 숫자(기본 초안)만 보낸다. 같은 메모는 한 번만 자동으로 쓴다
function memoAsk(key, force) {

  if (!force && ((P.memos || {})[key] || aiFail[key])) return;
  aiPending[key] = true; delete aiFail[key];
  g.request({ type: 'gemini_memo', id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, key, facts: memoDrafts[key] });
  const hint = document.querySelector(`details.memo[data-memo="${CSS.escape(key)}"] summary .hint`); if (hint) hint.textContent = 'Gemini 로 쓰는 중…';
}
window.DA_GEMINI_RECEIVE = r => {
  if (!r || !r.key) return;
  delete aiPending[r.key];
  if (r.ok && r.text && P) { const cur = (P.memos || {})[r.key]; if (!cur || cur.src === 'ai') memoSave(r.key, r.text, 'ai'); }
  else { aiFail[r.key] = r.message || 'Gemini 초안을 받지 못해 기본 초안을 보여 줍니다'; if (!memoEdit) render(true); }
};
window.DA_GEMINI_STATUS = () => { if (P && !memoEdit) { clearTimeout(aiTimer); aiTimer = setTimeout(() => document.querySelectorAll('details.memo[data-memo]').forEach(d => memoAsk(d.dataset.memo)), 1200); } };
// 초안 문구 도우미
const pctS = p => (p == null ? '–' : C.signed(p));
const pp = (a, b) => (a == null || b == null ? null : (a - b) * 100);           // %p
const ppS = d => (d == null ? '–' : `${d >= 0 ? '+' : '△'}${Math.abs(d).toFixed(1)}%p`);
function mediaMoves(c, curIdx, cmpIdx) {
  // 매체별 거래액 · 광고비 증감(실적 − 비교), 큰 순
  const t = C.tree(R, { bucket: bucketArg(), where: S.filt, names: S.names }, ['md'], [curIdx, cmpIdx]);
  return [...t.nodes.values()].map(n => ({ v: n.v, dr: n.s[0].nrev - n.s[1].nrev, dc: n.s[0].cost - n.s[1].cost, r0: C.div(n.s[0].nrev, n.s[0].cost), r1: C.div(n.s[1].nrev, n.s[1].cost), c0: n.s[0].cost }));
}
function draftCards(c, sAt, sCmp, cmpName, cmpIdx, curIdx, tgt) {
  const M = C.METRIC, at = c.at, L = [];
  const v = k => vy(M[k], sAt, at.y), w = k => vy(M[k], sCmp, at.y - 1);
  const mil = x => (x == null ? '–' : `${C.fmtNum(x / 1e6, 1)}백만원`);
  L.push(`■ ${at.label}${at.partial ? ' (진행 중)' : ''} · ${bucketName()} · 집행 ${sAt.days}일 · 비교: ${cmpName}`);
  if (!sCmp.days) L.push(`• 비교 기간 데이터가 없어 증감은 표시하지 않습니다.`);
  L.push(`• 광고비 ${mil(sAt.cost)} (${cmpName} 대비 ${pctS(C.pct(sAt.cost, sCmp.cost))}) · 거래액(순결제) ${mil(sAt.nrev)} (${pctS(C.pct(sAt.nrev, sCmp.nrev))})`);

  if (r0 != null) {
    const dc = C.pct(sAt.cost, sCmp.cost), dr = C.pct(sAt.nrev, sCmp.nrev);
    let why = '';
    if (dc != null && dr != null && r1 != null) why = r0 < r1 ? ` — 광고비 증감(${pctS(dc)})이 거래액 증감(${pctS(dr)})보다 커서 효율이 낮아짐` : r0 > r1 ? ` — 거래액 증감(${pctS(dr)})이 광고비 증감(${pctS(dc)})보다 커서 효율이 좋아짐` : '';
    L.push(`• ROAS(순결제) ${C.fmt(M.roas, r0)} (${cmpName} ${C.fmt(M.roas, r1)}, ${ppS(pp(r0, r1))})${why}`);
  }
  if (tgt) {
    const ach = (a, b) => (a != null && b ? `${C.fmtNum(a / b * 100, 1)}%` : '–');
    L.push(`• 목표 대비: 광고비 집행 ${ach(sAt.cost, tgt.spend)} · 거래액 달성 ${ach(sAt.nrev, tgt.rev)} · ROAS ${C.fmt(M.roas, r0)} (목표 ${C.fmt(M.roas, tgt.roas)}, ${ppS(pp(r0, tgt.roas))})`);
  }

    const up = mv.filter(x => x.dr > 0).sort((a, b) => b.dr - a.dr).slice(0, 2), dn = mv.filter(x => x.dr < 0).sort((a, b) => a.dr - b.dr).slice(0, 2);
    const one = x => `${x.v}(${x.dr >= 0 ? '+' : '△'}${C.fmtNum(Math.abs(x.dr) / 1e6, 1)}백만, ROAS ${C.fmt(M.roas, x.r0)})`;
    if (up.length || dn.length) L.push(`• 매체별 거래액 증감(${cmpName} 대비): ${up.length ? '증가 ' + up.map(one).join(', ') : ''}${up.length && dn.length ? ' / ' : ''}${dn.length ? '감소 ' + dn.map(one).join(', ') : ''}`);

    if (bigCost && bigCost.r0 != null && r0 != null && bigCost.r0 < r0) L.push(`• 광고비가 가장 많이 늘어난 ${bigCost.v}(+${C.fmtNum(bigCost.dc / 1e6, 1)}백만)의 ROAS가 전체보다 낮음 → 효율 하락 요인으로 보임(가설)`);

}
function draftTrend(c, ys) {

  const vals = (k, kk) => { const l = line(k, kk); return l ? l.sums.map(t => (t ? val(M[k], t) : null)) : []; };
  L.push(`[추이 · ${GRAIN_N[S.grain]}]`);

    const v0 = vals(k, 0), v1 = vals(k, 1), m = M[k];
    let pts = v0.map((v, i) => [i, v]).filter(([, v]) => v != null);
    // 누계에서 진행 중인 기간은 덜 쌓인 값이라 추세 판단에서 뺀다 (일평균 · 비율은 그대로)

    const a = last3[0][1], b = last3[last3.length - 1][1], ch = C.pct(b, a);
    const dir = ch == null ? '' : Math.abs(ch) < 2 ? '보합' : ch > 0 ? '상승' : '하락';
    const gaps = pts.map(([i, v]) => [i, C.pct(v, v1[i])]).filter(([, g]) => g != null);
    let gap = '';

      const best = gaps.reduce((x, y) => (y[1] > x[1] ? y : x)), worst = gaps.reduce((x, y) => (y[1] < x[1] ? y : x));
      gap = ` · 전년 대비 가장 좋았던 때 ${ys.labels[best[0]]}(${pctS(best[1])}), 가장 낮았던 때 ${ys.labels[worst[0]]}(${pctS(worst[1])})`;
    }
    L.push(`• ${m.n}: 최근 ${last3.length}${unitN} ${seq} (${dir})${partialSum ? ` · 진행 중인 ${c.at.short || ''}은 덜 쌓인 누계라 제외` : ''}${gap}`);
  }
  if (S.grain === 'month') {
    const ytd = [0, 1].map(kk => (line('cost', kk) || { sums: [] }).sums.slice(0, c.at.m).filter(Boolean));
    const sum = (arr, f) => arr.reduce((a, t) => a + t[f], 0);
    if (ytd[0].length && ytd[1].length) {
      const c0 = sum(ytd[0], 'cost'), c1 = sum(ytd[1], 'cost'), n0 = sum(ytd[0], 'nrev'), n1 = sum(ytd[1], 'nrev');

    }
  }

}

      <button class="btn" data-csv-for="drTbl" data-name="DA_펼쳐보기_${esc(at.key)}">CSV</button>
    </div></div></section>
    <section><div class="card tbl-wrap"><table class="grid" id="drTbl"></table></div><p class="hint" style="margin:6px 2px 0">칸 아래 = ${cmpL} · 캠페인 · 하위캠페인 · 기획전번호 단계는 매년 바뀌어 증감을 달지 않습니다 · 숫자 칸 드래그 = 합계</p></section>
    <section id="drSelSec"></section>`;
  const v = (m, sm, yr) => vy(m, sm, yr);
  const cellRow = (n, dim) => ms.map(m => {
    const a = v(m, n.s[0], at.y), b = v(m, n.s[1], at.y - cmpY);
    return numCell(m, a, dim && NO_DELTA_DIMS.has(dim) ? '' : `<span class="sub">${deltaHTML(m, a, b)}</span>`);
  }).join('');
  const small = n => Math.abs(n.s[0].cost) + Math.abs(n.s[1].cost) < 1e4 * Math.max(1, n.s[0].days) && n.s[0].nrev + n.s[1].nrev + n.s[0].join + n.s[1].join < 1;
  const open = new Set(D.open), sortM = C.METRIC[D.sort] || C.METRIC.cost;
  const sortV = n => { const x = v(sortM, n.s[0], at.y); return x == null ? -Infinity : (sortM.lowerBetter ? -x : x); };
  const matches = new Set(), direct = new Set();
  if (q) for (const n of t.nodes.values()) if (String(n.v).toLowerCase().includes(q)) { direct.add(n.key); let k = n.key; for (;;) { matches.add(k); const j = k.lastIndexOf('|'); if (j < 0) break; k = k.slice(0, j); } }
  const visible = key => { if (matches.has(key)) return true; let k = key; while (k.includes('|')) { k = k.slice(0, k.lastIndexOf('|')); if (direct.has(k)) return true; } return false; };
  let body = '';
  const walk = (parentKey, level) => {
    let kids = C.children(t, parentKey, level);
    if (D.hideSmall) kids = kids.filter(n => !small(n));
    if (q) kids = kids.filter(n => visible(n.key));
    kids.sort((a, b) => sortV(b) - sortV(a));
    const top = +D.top || 0, extra = top && kids.length > top ? kids.slice(top) : [];
    if (extra.length) kids = kids.slice(0, top);
    for (const n of kids) {
      const canOpen = level < D.dims.length - 1, isOpen = canOpen && (open.has(n.key) || (!!q && matches.has(n.key) && !direct.has(n.key)));
      body += `<tr data-key="${esc(n.key)}" class="${D.sel === n.key ? 'sel' : ''}"><td style="padding-left:${10 + level * 18}px" data-csv="${esc('  '.repeat(level) + n.v)}">${canOpen ? `<button class="tw" data-tw="${esc(n.key)}" aria-expanded="${isOpen}" aria-label="펼치기">${isOpen ? '▾' : '▸'}</button>` : '<span class="tw"></span>'}<span class="lv">${DIM_NAME[n.dim]}</span><button class="nm" data-dsel="${esc(n.key)}" title="${esc(n.v)}">${esc(n.v || '(빈 값)')}</button></td>${cellRow(n, n.dim)}</tr>`;
      if (isOpen) walk(n.key, level + 1);
    }
    if (extra.length) {
      const agg = [0, 1].map(k => { const o = { days: Math.max(...extra.map(n => n.s[k].days)) }; for (const b of C.BASE) o[b] = extra.reduce((a, n) => a + n.s[k][b], 0); return o; });
      body += `<tr class="etc"><td style="padding-left:${28 + level * 18}px" data-csv="${esc('  '.repeat(level) + `그 외 ${extra.length}개`)}"><span class="hint">그 외 ${extra.length}개 (합계)</span></td>${cellRow({ s: agg }, 'camp')}</tr>`;
    }
  };
  walk('', 0);
  $id('drTbl').innerHTML = `<thead><tr><th>${D.dims.map(d => DIM_NAME[d]).join(' › ')}</th>${ms.map(m => `<th><b>${m.n}</b>${C.unit(m, S.mode)}</th>`).join('')}</tr></thead>
    <tbody><tr class="tot" data-key=""><td><button class="nm" data-dsel="">합계</button></td>${cellRow({ s: t.total })}</tr>${body || `<tr><td colspan="${ms.length + 1}" class="hint">조건에 맞는 항목이 없습니다</td></tr>`}</tbody>`;
  // 선택 항목 추이 (연도 겹쳐보기)
  const selKey = D.sel && t.nodes.has(D.sel) ? D.sel : '';
  const name = selKey ? selKey.split('|').map((ix, L) => R.dims[D.dims[L]][+ix] || '(빈 값)').join(' › ') : '합계';
  const where = selKey ? { ...S.filt, ...C.keyWhere(R, D.dims, selKey) } : S.filt;
  const s2 = C.daily(R, { bucket: bucketArg(), where, names: S.names });
  const ys = yearSeries(s2, c.ps, c.sh, at), tk = ['cost', 'nrev', 'roas', 'trev', 'join', 'fp'];
  $id('drSelSec').innerHTML = `<div class="sec-h"><h2>선택 항목 추이 · ${esc(name)}</h2><span class="desc">${GRAIN_N[S.grain]} · ${S.mode === 'avg' ? '일평균' : '누계'} · 연도 겹쳐보기</span></div><div class="charts">${tk.map(k => `<div class="card cc"><div class="cc-t">${C.METRIC[k].n}<span class="hint">${C.unit(C.METRIC[k], S.mode)}</span></div><div class="cc-b" id="dc-${k}"></div></div>`).join('')}</div>`;
  drawYearCharts(ys, tk, 'dc-');
}

    <li><b>리뷰 메모</b> 요약 시트 전체(카드 · 실적 요약표 · 추이)를 한 번에 정리합니다. Gemini 가 연결돼 있으면 화면이 계산한 숫자로 Gemini 가 1차 초안을 쓰고(원본 데이터는 보내지 않음), 아니면 규칙으로 만든 기본 초안이 보입니다. '편집'으로 고쳐 저장하면 그 글이 남습니다(기간 · 단위 · 비용출처 · 필터별). 메모는 이 브라우저와 '백업 내려받기' 파일에 함께 저장됩니다.</li>

    ${(src.missing || []).length ? `<li class="hint">원천에 없어 0 으로 둔 지표 키: ${esc(src.missing.join(', '))}</li>` : ''}
  </ul></div></details></section>`;
}

function filterSummary() {
  const p = [];
  for (const [k, n] of FILT_DIMS) { const v = S.filt[k]; if (v && R && R.dims[k]) p.push(v.length <= 2 ? `${n} ${v.join('·')}` : `${n} ${v.length}개`); }
  for (const [k, n] of NAME_DIMS) if (S.names[k]) p.push(`${n} '${S.names[k]}'`);
  return p.join(' · ');
}
function filterCount() { return FILT_DIMS.filter(([k]) => S.filt[k]).length + NAME_DIMS.filter(([k]) => S.names[k]).length; }
let chipQ = {};
function renderFilt() {
  const el = $id('filtRows');
  el.hidden = !S.filtOpen;
  if (!S.filtOpen || !R) return;
  let h = '';
  for (const [k, n] of FILT_DIMS) {
    const vals = R.dims[k];
    if (!vals || vals.length < 2) continue;
    const sel = S.filt[k] ? new Set(S.filt[k]) : null, q = (chipQ[k] || '').toLowerCase();
    const list = q ? vals.filter(v => v.toLowerCase().includes(q)) : vals;
    h += `<div class="bar2"><span class="flabel">${n}</span>${vals.length > 12 ? `<input type="search" data-chipq="${k}" placeholder="${n} 찾기" value="${esc(chipQ[k] || '')}" style="width:120px">` : ''}
      <div class="chips" role="group" aria-label="${n} 선택">${list.map(v => `<button class="chip" data-fk="${k}" data-fv="${esc(v)}" aria-pressed="${!sel || sel.has(v)}"><i></i>${esc(v || '(빈 값)')}</button>`).join('')}</div>
      <button class="lnk" data-fall="${k}">모두</button>${sel ? `<span class="hint">${sel.size}개 선택</span>` : ''}</div>`;
  }
  h += `<div class="bar2">${NAME_DIMS.filter(([k]) => R.dims[k] && R.dims[k].length > 1).map(([k, n]) => `<label class="field">${n} <input type="search" data-name="${k}" placeholder="포함(쉼표로 여러 개) · 제외는 -" value="${esc(S.names[k] || '')}" style="width:220px"></label>`).join('')}
    <button class="lnk" id="filtReset">필터 모두 해제</button></div>`;
  el.innerHTML = h;
}

// ════════════════════════════════════════════════════════════════════
// 드래그 합계 — 표에서 숫자 칸을 드래그하면 합계 · 평균 · 최소 · 최대
// ════════════════════════════════════════════════════════════════════
const SEL = { table: null, a: null, f: null, drag: false };
function cellPos(td) { const tr = td.parentElement; return { r: [...tr.parentElement.children].indexOf(tr), c: [...tr.children].indexOf(td) }; }
function selCells() {
  if (!SEL.table || !SEL.a) return [];
  const r0 = Math.min(SEL.a.r, SEL.f.r), r1 = Math.max(SEL.a.r, SEL.f.r), c0 = Math.min(SEL.a.c, SEL.f.c), c1 = Math.max(SEL.a.c, SEL.f.c);
  const rows = [...SEL.table.tBodies[0].rows].slice(r0, r1 + 1);
  return rows.map(tr => [...tr.children].slice(c0, c1 + 1));
}
function paintSel() {
  document.querySelectorAll('td.selc').forEach(td => td.classList.remove('selc'));
  const grid = selCells(), bar = $id('selbar');
  const cells = grid.flat().filter(td => td.dataset.v != null);
  cells.forEach(td => td.classList.add('selc'));
  if (cells.length < 1 || !SEL.a) { bar.hidden = true; return; }
  const vs = cells.map(td => +td.dataset.v), ms = [...new Set(cells.map(td => td.dataset.m))].map(k => C.METRIC[k]);
  const kinds = new Set(ms.map(m => m.kind)), one = ms.length === 1 ? ms[0] : null;
  const canSum = ms.every(C.additive) && kinds.size === 1;
  const unitTxt = kinds.size === 1 ? C.unit(ms[0], S.mode) : '';
  const f = v => (ms.every(m => m.kind === 'won' || m.kind === 'count') ? C.fmtNum(v, Math.abs(v) < 100 ? 1 : 0) : C.fmtNum(v, Math.abs(v) < 10 ? 2 : 1));
  const sum = vs.reduce((a, b) => a + b, 0);
  bar.innerHTML = `<span><span class="k">선택</span><b>${cells.length}칸</b>${one ? ` · ${esc(one.n)}` : ''}</span>
    ${canSum ? `<span><span class="k">합계</span><b>${f(sum)}</b> ${esc(unitTxt.replace('/일', ''))}${S.mode === 'avg' ? ' <span class="k">(일평균 값의 합)</span>' : ''}</span>` : `<span class="k">${kinds.size > 1 ? '단위가 달라 합계 없음' : '비율 · 단가는 더하지 않음'}</span>`}
    <span><span class="k">평균</span><b>${f(sum / vs.length)}</b></span><span><span class="k">최소</span>${f(Math.min(...vs))}</span><span><span class="k">최대</span>${f(Math.max(...vs))}</span>
    <button type="button" id="selCopy">복사</button><button type="button" id="selClear">해제(Esc)</button>`;
  bar.hidden = false;
}
function clearSel() { SEL.table = SEL.a = SEL.f = null; SEL.drag = false; paintSel(); }
function copySel() {
  const grid = selCells();
  if (!grid.length) return;
  const txt = grid.map(row => row.map(td => td.dataset.v != null ? td.dataset.v : (td.dataset.csv != null ? td.dataset.csv : td.innerText.split('\n')[0]).trim()).join('\t')).join('\n');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* 무시 */ } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).catch(fallback); else fallback();
  toast(`${grid.length}행 × ${grid[0].length}열을 복사했습니다 (엑셀에 붙여넣기)`);
}
document.addEventListener('mousedown', e => {
  const td = e.target.closest && e.target.closest('table.grid tbody td');
  if (td && e.button === 0) {
    const table = td.closest('table'), pos = cellPos(td);
    if (e.shiftKey && SEL.table === table && SEL.a) { SEL.f = pos; e.preventDefault(); paintSel(); return; }
    if (td.dataset.v == null) { if (SEL.a) clearSel(); return; }
    SEL.table = table; SEL.a = SEL.f = pos; SEL.drag = true; e.preventDefault(); paintSel();
    return;
  }
  if (SEL.a && !(e.target.closest && e.target.closest('#selbar'))) clearSel();
});
document.addEventListener('mouseover', e => {
  if (!SEL.drag) return;
  const td = e.target.closest && e.target.closest('table.grid tbody td');
  if (!td || td.closest('table') !== SEL.table) return;
  const pos = cellPos(td);
  if (pos.r !== SEL.f.r || pos.c !== SEL.f.c) { SEL.f = pos; paintSel(); }
});
document.addEventListener('mouseup', () => { SEL.drag = false; });
document.addEventListener('keydown', e => {
  if (!SEL.a) return;
  if (e.key === 'Escape') clearSel();
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && !(window.getSelection() + '')) { e.preventDefault(); copySel(); }
});

  $id('fCmp').hidden = $id('segCmp').hidden = S.page !== 'drill' || !!S.cu;   // 요약 카드 · 표는 전년 · 전전년 고정, 펼쳐보기만 비교 선택
  $id('selRange').innerHTML = RANGES[S.grain].map(([v, l]) => `<option value="${v}"${String(S.range[S.grain]) === String(v) ? ' selected' : ''}>${l}</option>`).join('');
  const nf = filterCount();
  $id('filtSum').textContent = filterSummary() || '채널 · 매체 · 상품 · 부서 · 캠페인 …';
  $id('filtN').hidden = !nf; $id('filtN').textContent = nf;
  $id('btnFilt').setAttribute('aria-expanded', S.filtOpen);
  renderFilt();
}
const PAGES = { summary: renderSummary, drill: renderDrill };
function render(keepScroll) {
  if (!P) return showEmpty();
  if (!PAGES[S.page]) S.page = 'summary';
  // 저장된 필터 중 데이터에 없는 값은 지운다
  for (const k of Object.keys(S.filt)) { if (!R.dims[k]) { delete S.filt[k]; continue; } S.filt[k] = S.filt[k].filter(v => R.dims[k].includes(v)); if (!S.filt[k].length || S.filt[k].length === R.dims[k].length) delete S.filt[k]; }
  if (S.cu) { const lo = R.dates[0], hi = lastDate(), cl = d => (d < lo ? lo : d > hi ? hi : d); S.cu = { ...S.cu, r0: cl(S.cu.r0), r1: cl(S.cu.r1), c0: cl(S.cu.c0), c1: cl(S.cu.c1) }; }
  syncBar();
  save();
  SEL.table = SEL.a = SEL.f = null; $id('selbar').hidden = true;
  const y = window.scrollY, main = $id('main');
  try {
    PAGES[S.page](main);
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="card pad warn" style="margin-top:24px">화면을 그리다 오류가 났습니다: ${esc(e.message)}</div>`;
  }
  if (keepScroll) window.scrollTo(0, y);
}

// ── 이벤트 ─────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const ds = t.dataset;
  if (ds.page) { S.page = ds.page; render(); window.scrollTo(0, 0); return; }
  if (ds.set) { S[ds.set] = ds.v; if (ds.set === 'grain') S.at = ''; render(true); return; }
  if (ds.bucket != null) { if (S.bucket === '상세' && ds.bucket !== '상세') delete S.filt.src; S.bucket = ds.bucket; render(true); return; }
  if (ds.cols) { S.cols = ds.cols; render(true); return; }
  if (ds.dcols) { S.drill.cols = ds.dcols; render(true); return; }
  if (ds.tw != null) { const o = new Set(S.drill.open); o.has(ds.tw) ? o.delete(ds.tw) : o.add(ds.tw); S.drill.open = [...o]; render(true); return; }
  if (ds.dsel != null) { S.drill.sel = ds.dsel; render(true); const sc = $id('drSelSec'); if (sc) sc.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.id === 'drFold') { S.drill.open = []; render(true); return; }
  if (ds.memoEdit) { memoEdit = ds.memoEdit; render(true); const ta = $id('memoTa'); if (ta) ta.focus(); return; }
  if (ds.memoCancel) { memoEdit = ''; render(true); return; }
  if (ds.memoSave) { memoSave(ds.memoSave, $id('memoTa').value); return; }
  if (ds.memoReset) { if (confirm('저장된 메모를 지우고 기본 초안으로 되돌릴까요?')) memoSave(ds.memoReset, null); return; }
  if (ds.memoAi) { memoAsk(ds.memoAi, true); return; }
  if (t.id === 'cuYoy') { const sh = d => C.iso(C.dnum(d) - 364); S.cu = { ...S.cu, c0: sh(S.cu.r0), c1: sh(S.cu.r1), auto: true }; render(true); return; }
  if (ds.grp != null) { const o = new Set(S.grpOpen || []); o.has(ds.grp) ? o.delete(ds.grp) : o.add(ds.grp); S.grpOpen = [...o]; render(true); return; }
  if (ds.grpAll != null) { S.grpOpen = ds.grpAll === '1' ? GROUPS.slice(1).map(([g]) => g) : []; render(true); return; }
  if (ds.csvFor) { const tb = $id(ds.csvFor); if (tb) tableCSV(tb, ds.name || '표'); return; }
  if (ds.fk) {
    const all = R.dims[ds.fk];
    let sel = new Set(S.filt[ds.fk] || all);
    if (!S.filt[ds.fk]) sel = new Set([ds.fv]);          // 모두 선택된 상태에서 누르면 그것만
    else { sel.has(ds.fv) ? sel.delete(ds.fv) : sel.add(ds.fv); }
    if (!sel.size || sel.size === all.length) delete S.filt[ds.fk]; else S.filt[ds.fk] = all.filter(v => sel.has(v));
    render(true); return;
  }
  if (ds.fall) { delete S.filt[ds.fall]; render(true); return; }
  if (t.id === 'filtReset') { S.filt = {}; S.names = {}; chipQ = {}; render(true); return; }
  if (t.id === 'btnFilt') { S.filtOpen = !S.filtOpen; syncBar(); save(); return; }
  if (t.id === 'btnOpen') { $id('fileOpen').click(); return; }
  if (t.id === 'btnSave') { downloadBackup(); return; }
  if (t.id === 'selCopy') { copySel(); return; }
  if (t.id === 'selClear') { clearSel(); return; }
  if (t.id === 'btnClear') { if (confirm('이 브라우저에 저장된 데이터(24년 포함)를 지울까요? 지운 뒤에는 원천 파일을 다시 올려야 합니다.')) { idbDel().then(() => { P = R = null; $id('btnClear').hidden = true; $id('btnSave').hidden = true; $id('asof').textContent = ''; showEmpty(); }); } return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selAt') {
    if (t.value === '__custom') {      // 지금 기준 기간으로 시작, 비교는 전년 동요일
      const at = shown(plist()).slice(-1)[0], r0 = C.iso(at.start), r1 = C.iso(Math.min(at.end, at.lastN)), sh = d => C.iso(C.dnum(d) - 364);
      S.cu = S.cu || { r0, r1, c0: sh(r0), c1: sh(r1), auto: true };
    } else { S.cu = null; S.at = t.value; }
    render(true);
  }
  else if (['cuR0', 'cuR1', 'cuC0', 'cuC1'].includes(t.id)) {
    if (t.value) {
      const k = { cuR0: 'r0', cuR1: 'r1', cuC0: 'c0', cuC1: 'c1' }[t.id], cu = { ...S.cu, [k]: t.value };
      if (k[0] === 'c') cu.auto = false;                                   // 비교 기간을 직접 고치면 그대로 둔다
      if (cu.r0 > cu.r1) cu.r1 = cu.r0;
      if (cu.auto) { const sh = d => C.iso(C.dnum(d) - 364); cu.c0 = sh(cu.r0); cu.c1 = sh(cu.r1); }   // 아니면 실적 기간을 따라 전년 동요일
      if (cu.c0 > cu.c1) cu.c1 = cu.c0;
      S.cu = cu; render(true);
    }
  }
  else if (t.dataset.dim != null) { const L = +t.dataset.dim, d = S.drill.dims.slice(); if (t.value) d[L] = t.value; else d.length = L; S.drill.dims = d.filter((x, i) => x && d.indexOf(x) === i); S.drill.open = []; S.drill.sel = ''; render(true); }
  else if (t.id === 'drSort') { S.drill.sort = t.value; render(true); }
  else if (t.id === 'drTop') { S.drill.top = +t.value; render(true); }
  else if (t.id === 'drSmall') { S.drill.hideSmall = t.checked; render(true); }
  else if (t.id === 'selRange') { S.range[S.grain] = t.value === 'all' ? 'all' : +t.value; render(true); }
  else if (t.id === 'fileOpen') { if (t.files[0]) openFile(t.files[0]); t.value = ''; }
  else if (t.id === 'chkCmp') { S.showCmp = t.checked; render(true); }
  else if (t.id === 'chkPrevY') { S.prevY = t.checked; render(true); }
});
let qTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.chipq) { chipQ[t.dataset.chipq] = t.value; const k = t.dataset.chipq, pos = t.selectionStart; renderFilt(); const n = document.querySelector(`[data-chipq="${k}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (t.id === 'drQ') {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { S.drill.q = t.value; render(true); const n = $id('drQ'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 300);
    return;
  }
  if (t.dataset.name) {
    clearTimeout(qTimer);
    const k = t.dataset.name;
    qTimer = setTimeout(() => { if (t.value.trim()) S.names[k] = t.value.trim(); else delete S.names[k]; render(true); const n = document.querySelector(`[data-name="${k}"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 400);
  }
});
// 끌어다 놓기
['dragenter', 'dragover'].forEach(n => document.addEventListener(n, e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); document.body.classList.add('dragging'); } }));
['dragleave', 'drop'].forEach(n => document.addEventListener(n, e => { if (n === 'dragleave' && e.relatedTarget) return; document.body.classList.remove('dragging'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f) { e.preventDefault(); openFile(f); } });
let rzT = null, lastW = innerWidth;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; clearTimeout(rzT); rzT = setTimeout(() => render(true), 250); });

async function preload() {
  // Streamlit 에서 방금 올린 원천으로 만든 백업 — app.py 가 window.DA_PRELOAD(base64 gzip) 로 넣어 준다
  const b64 = window.DA_PRELOAD;
  if (!b64) return false;
  let done = '';
  try { done = localStorage.getItem('da-dashboard-v2-preload') || ''; } catch (e) { /* 무시 */ }
  if (done === window.DA_PRELOAD_ID) return false;      // 이미 합친 것 (화면이 다시 그려진 경우)
  $id('main').innerHTML = '<div class="loading">올린 원천을 저장된 데이터에 합치는 중…</div>';
  try {
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const add = await readBackup(new File([bin], 'preload.json.gz'));
    try { localStorage.setItem('da-dashboard-v2-preload', window.DA_PRELOAD_ID || ''); } catch (e) { /* 무시 */ }
    await mergeAndStore(add);
  } catch (e) {
    showEmpty(`<p class="neg">${esc(e.message)}</p>`);
  }
  return true;
}
(async () => {
  syncBar();
  if (await preload()) return;
  const p = await idbGet();
  if (P) return;
  if (p) use(p); else showEmpty();
})();
</script>
